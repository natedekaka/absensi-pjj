<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lihat Absensi Koleksi Foto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="btn btn-small btn-primary">Kembali ke Absensi</a>
    </nav>

    <div class="container">
        <h1>Lihat Koleksi Foto Absensi</h1>
        <p class="subtitle">Masukkan NIS untuk melihat semua foto absensi</p>

        <div class="card active">
            <h2>Cari Absensi dengan NIS</h2>
            <form id="collageForm">
                <div class="form-group">
                    <label for="nisCollage">NIS</label>
                    <input type="text" id="nisCollage" name="nisCollage" placeholder="Masukkan NIS" required maxlength="12">
                </div>
                <button type="submit" id="viewBtn" class="btn btn-secondary">Tampilkan Absensi</button>
                <button type="button" id="exportBtn" class="btn btn-secondary" style="margin-top: 8px;">Export Absensi (CSV)</button>
                <div id="collageMessage"></div>
                <div id="collageGrid"></div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
